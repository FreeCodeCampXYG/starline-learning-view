name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Thank you for taking the time to help improve this project. Do not include secrets or personal data."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, operating system, runtime, and relevant configuration with secrets redacted.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Paste minimal redacted evidence. Never paste tokens, passwords, or private keys.
