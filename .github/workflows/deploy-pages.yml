name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub 使用 UTC；每 6 小时自动刷新一次，避开整点高峰。
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Refresh public GitHub project index
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HIDDEN_GITHUB_REPOSITORIES: ${{ vars.HIDDEN_GITHUB_REPOSITORIES }}
        run: python scripts/sync_github_projects.py --owner FreeCodeCampXYG --output data/github-projects.json

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f knowledge-map.js
          test -f project-map.js
          test -f data/notes.json
          test -f data/github-projects.json
          test -f data/project-guides.json
          test -f data/relations.json
          node --check app.js
          node --check knowledge-map.js
          node --check project-map.js
          python -m json.tool data/notes.json > /dev/null
          python -m json.tool data/github-projects.json > /dev/null
          python -m json.tool data/project-guides.json > /dev/null
          python -m json.tool data/relations.json > /dev/null
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp index.html styles.css app.js knowledge-map.js project-map.js _site/
          cp data/notes.json _site/data/
          cp data/github-projects.json _site/data/
          cp data/project-guides.json _site/data/
          cp data/relations.json _site/data/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
